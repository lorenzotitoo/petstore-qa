name: Postman API Tests

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  postman-tests:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Install Postman CLI
        run: |
          curl -o- "https://dl-cli.pstmn.io/install/linux64.sh" | sh

      - name: Create reports directory
        run: mkdir -p postman/reports

      - name: Run Postman Collection
        run: |
          postman collection run "postman/PetStore.postman_collection.json" \
            --environment "postman/PetStore.postman_environment.json" \
            --working-dir "postman" \
            --reporters cli,junit,html \
            --reporter-junit-export "$GITHUB_WORKSPACE/postman/reports/postman-report.xml" \
            --reporter-html-export "$GITHUB_WORKSPACE/postman/reports/postman-report.html"

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: postman-test-reports
          path: postman/reports/
 